name: Report a bug
description: Something in Yonto Player doesn't work the way it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time.
        Everything here is public, so leave out server addresses, accounts, passwords and licence keys.
        No GitHub account, or would rather not post in public? Email support@yonto.app instead: https://player.yonto.app/support/
  - type: input
    id: version
    attributes:
      label: Yonto Player version
      description: From Settings, About.
      placeholder: "5.0.7"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android TV
        - Android phone
        - Android tablet
        - iPhone or iPad
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: "Chromecast with Google TV, Pixel 8, ..."
  - type: dropdown
    id: source
    attributes:
      label: Source type
      description: The kind of source you were using when it happened.
      options:
        - Jellyfin
        - Plex
        - Emby
        - MacCMS
        - Custom HTTP
        - A plugin
        - A repo
        - The demo library
        - Not about a source
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: What the screen said
      description: Word for word, including any code in brackets. A screenshot or a photo of the screen is fine; drag it in here.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The steps that led to it, and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
