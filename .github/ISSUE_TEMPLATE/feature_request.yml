name: Request a feature
description: A protocol, a screen or a change that would make Yonto yours.
title: "Feature request: "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like Yonto to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
  - type: dropdown
    id: device
    attributes:
      label: Where you would use it
      multiple: true
      options:
        - Android TV
        - Android phone
        - Android tablet
        - iPhone or iPad
